name: maiq

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '5'

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      MAIQ_DATABASE_URL: postgres://maiq:${POSTGRES_PASSWORD}@postgres:5432/maiq
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./maiq.d:/app/maiq.d:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: maiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: maiq
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U maiq -d maiq]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped
