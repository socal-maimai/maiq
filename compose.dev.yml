name: maiq-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: maiq
      POSTGRES_PASSWORD: maiq
      POSTGRES_DB: maiq
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - ./.data/postgres-dev:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U maiq -d maiq]
      interval: 5s
      timeout: 3s
      retries: 10
